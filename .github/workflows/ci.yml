name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      # 有签名 secrets 就用正式签名，否则回退 debug 签名
      - name: Configure release signing (if secrets present)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/release.keystore
          cat > keystore.properties <<EOF
          storeFile=keystore/release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Unit tests
        run: gradle testDebugUnitTest --console=plain

      - name: Build APKs
        run: gradle assembleDebug assembleRelease --console=plain

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      # 推送 v* tag 时自动发布 Release
      - name: Publish Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          if [ -n "$RELEASE_APK" ]; then
            gh release create "${{ github.ref_name }}" "$RELEASE_APK" \
              --title "Haha Remote ${{ github.ref_name }}" \
              --notes "Release ${{ github.ref_name }} — see README for install & usage."
          fi
