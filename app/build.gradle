plugins {
    id 'com.android.application'
}

// 读取签名配置（keystore.properties 不进 git，见 README）
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
boolean hasSigning = keystorePropsFile.exists()
if (hasSigning) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.cchaha.remote'
    compileSdk 34

    defaultConfig {
        applicationId "com.cchaha.remote"
        minSdk 26
        targetSdk 34
        // 注意：每次发版必须同步递增 versionCode 和 versionName（v1.7.x = code 2x）
        versionCode 41
        versionName "1.8.7"
    }

    signingConfigs {
        release {
            if (hasSigning) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            // R8 压缩混淆 + 资源收缩
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 有正式签名配置就用正式签名，否则回退 debug 签名（便于本地出包）
            signingConfig hasSigning ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }

    // APK 文件名带产品名和版本：cchaha-mobile-v1.0.9.apk
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "cchaha-mobile-v${variant.versionName}" +
                    (variant.buildType.name == "debug" ? "-debug" : "") + ".apk"
        }
    }
}

// 全局排除旧版 kotlin-stdlib-jdk7/8（新版 kotlin-stdlib 已合并这些类，避免与 camera 的 1.8.22 冲突）
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    // AndroidX 基础（CameraX 需要 LifecycleOwner）
    implementation 'androidx.activity:activity:1.9.1'
    // 下拉刷新
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // 自研扫码：CameraX 相机预览 + ZXing 解码（不依赖外部扫码 Activity，兼容性更稳）
    def camerax = '1.3.4' // 保持 1.3.4：1.6.x 需 compileSdk 36；当前 SDK 34。16KB 页对齐待 SDK 升级后处理
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    implementation 'com.google.zxing:core:3.5.3'

    testImplementation 'junit:junit:4.13.2'
    // 单测真实解析 JSON（android stub 下 org.json 是 mock）
    testImplementation 'org.json:json:20240303'
}
